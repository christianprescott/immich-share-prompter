services:
  dev: &base
    build:
      context: .
      target: dev
    ports:
      - 5173:5173
    environment:
      - IMMICH_HOST
      - IMMICH_API_KEY
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - SMTP_FROM
      - SMTP_TO
    volumes:
      - ./:/app/

  worker:
    <<: *base
    # Extend dev, but override ports so as not to expose any.
    ports: []
    # Builds the worker bundle (see vite.worker.config.ts) and runs it as a
    # separate, long-lived process from the web app. No hot-reload yet: rerun
    # `docker compose up --build worker` (or restart the service) after
    # changing worker code.
    command: sh -c "npm run worker:build && npm run worker"
